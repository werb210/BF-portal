name: silo-boundaries
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  enforce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - name: Resolve scope from PR label
        id: scope
        uses: actions/github-script@v8
        with:
          script: |
            const labels = (context.payload.pull_request?.labels ?? []).map((l) => l.name);
            // BF_PORTAL_v789_SCOPES - no scope label means unscoped (passes); labels are case-insensitive.
            const scoped = labels.find((l) => l.toLowerCase().startsWith("scope:")) ?? "";
            core.setOutput("label", scoped);
      - name: Scope checker's own tests
        run: node --test scripts/__tests__/enforce-silo-scope.test.mjs
      - name: Enforce silo scope
        run: |
          git fetch origin main
          node scripts/enforce-silo-scope.mjs \
            --label="${{ steps.scope.outputs.label }}" \
            --base=origin/main
