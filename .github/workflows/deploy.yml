name: deploy

# BF_PORTAL_v789_DEPLOY_AFTER_CI - deploy only a main commit whose CI run succeeded (it used to deploy on
# every push to main, in parallel with CI, so a red build could ship).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build_and_deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the commit CI passed
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ✅ CRITICAL: Create .env file for Vite (THIS is the fix)
      - name: Inject env for Vite
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_APP_URL=${{ secrets.VITE_APP_URL }}" >> .env
          echo "VITE_CLIENT_APP_URL=${{ secrets.VITE_CLIENT_APP_URL }}" >> .env
          echo "VITE_JWT_STORAGE_KEY=auth_token" >> .env
          echo "VITE_MSAL_CLIENT_ID=${{ secrets.VITE_MSAL_CLIENT_ID }}" >> .env
          echo "VITE_MSAL_TENANT_ID=${{ secrets.VITE_MSAL_TENANT_ID }}" >> .env
          echo "VITE_MSAL_REDIRECT_URI=${{ secrets.VITE_MSAL_REDIRECT_URI }}" >> .env
          echo "VITE_MSAL_SCOPES=${{ secrets.VITE_MSAL_SCOPES }}" >> .env

      # ❌ REMOVE ALL previous "verify env" steps — they are wrong

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
