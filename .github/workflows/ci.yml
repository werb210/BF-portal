name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=optional

      - name: Verify native binaries
        run: |
          node <<'NODE'
          const os = process.platform;
          const arch = process.arch;

          console.log(`platform=${os} arch=${arch}`);

          if (os === "linux" && arch === "x64") {
            console.log(require.resolve("@esbuild/linux-x64/bin/esbuild"));
            console.log(require.resolve("@rollup/rollup-linux-x64-gnu"));
          }

          if (os === "darwin" && arch === "arm64") {
            console.log(require.resolve("@esbuild/darwin-arm64/bin/esbuild"));
            console.log(require.resolve("@rollup/rollup-darwin-arm64"));
          }

          if (os === "darwin" && arch === "x64") {
            console.log(require.resolve("@esbuild/darwin-x64/bin/esbuild"));
            console.log(require.resolve("@rollup/rollup-darwin-x64"));
          }
          NODE

      - name: Guardrails
        run: |
          chmod +x scripts/ci-guard.sh
          ./scripts/ci-guard.sh

      - name: Check tracked directory casing
        run: node scripts/check-case-collisions.mjs

      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ci

      - name: Verify artifact
        run: test -f dist/index.html

  ios-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=optional
      - name: Verify native binaries
        run: |
          node <<'NODE'
          const os = process.platform;
          const arch = process.arch;

          console.log(`platform=${os} arch=${arch}`);

          if (os === "linux" && arch === "x64") {
            console.log(require.resolve("@esbuild/linux-x64/bin/esbuild"));
            console.log(require.resolve("@rollup/rollup-linux-x64-gnu"));
          }

          if (os === "darwin" && arch === "arm64") {
            console.log(require.resolve("@esbuild/darwin-arm64/bin/esbuild"));
            console.log(require.resolve("@rollup/rollup-darwin-arm64"));
          }

          if (os === "darwin" && arch === "x64") {
            console.log(require.resolve("@esbuild/darwin-x64/bin/esbuild"));
            console.log(require.resolve("@rollup/rollup-darwin-x64"));
          }
          NODE
      - name: Check tracked directory casing
        run: node scripts/check-case-collisions.mjs
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Verify artifact
        run: test -f dist/index.html
      - run: npx cap sync ios
      - name: Resolve Swift package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build complete iPad app for Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: Build BorealWidget target for Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -target BorealWidget \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
