# BF_PORTAL_v876_NATIVE_DESKTOP - the native staff-portal app (Tauri 2): WKWebView on macOS, WebView2 on Windows.
[package]
name = "staff-portal-desktop"
version = "2.0.0"
description = "Native desktop app for the staff portal"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "staff_portal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-updater = "2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
